services:
  postgres_DyoRijki:
    image: postgres:15-alpine
    container_name: postgres_DyoRijki
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${PG_HOST_PORT}:5432"
    volumes:
      - pgdata_DyoRijki:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin_DyoRijki:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_DyoRijki
    env_file:
      - ./.env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    depends_on:
      - postgres_DyoRijki
    volumes:
      - pgadmin_data_DyoRijki:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  pgdata_DyoRijki:
  pgadmin_data_DyoRijki:
